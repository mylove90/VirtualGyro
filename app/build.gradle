plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.virtualgyro'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.virtualgyro'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0-libxposed102'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compile-time API only; the installed Xposed framework provides it at runtime.
    compileOnly 'io.github.libxposed:api:102.0.0'
}
